
<!DOCTYPE html>
<html>
<head>
    <title>North London After School Club</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

<div id="app">

    <h1>North London After School Club</h1>

    <button @click="showCart" :disabled="cart.length === 0">
        {{ displayCart ? 'Back to Lessons' : 'Checkout' }}
        ({{ cart.length }})
    </button>

    <div v-if="!displayCart">

        <div v-for="lesson in lessons" :key="lesson.id">

            <h2>{{ lesson.subject }}</h2>
            <p>Location: {{ lesson.location }}</p>
            <p>Price: £{{ lesson.price }}</p>
            <p>Spaces: {{ lesson.availability }}</p>

            <img v-if="lesson.image"
                 :src="lesson.image"
                 :alt="lesson.alt"
                 width="200">

            <br><br>

            <button @click="addToCart(lesson)"
                    :disabled="lesson.availability === 0">
                Add to Cart
            </button>

            <hr>

        </div>

    </div>

    <div v-else>

        <h2>Shopping Cart</h2>

        <div v-for="(id, index) in cart" :key="index">

            <div v-for="lesson in lessons" :key="lesson.id">

                <div v-if="lesson.id === id">

                    <p>
                        {{ lesson.subject }} -
                        £{{ lesson.price }}

                        <button @click="removeFromCart(index, lesson)">
                            Remove
                        </button>
                    </p>

                </div>

            </div>

        </div>

        <p>Total items: {{ cart.length }}</p>

        <h2>Checkout</h2>

        <p>Name:</p>
        <input type="text" v-model="name">

        <p>Phone Number:</p>
        <input type="text" v-model="phone">

        <br><br>

        <button @click="placeOrder"
                :disabled="name === '' || phone === '' || cart.length === 0">
            Place Order
        </button>

        <p>{{ message }}</p>

    </div>

</div>

<script>

const { createApp } = Vue;

createApp({

    data() {
        return {

            lessons: [
                {
                    id: 1001,
                    subject: "Computer Science",
                    location: "Hendon",
                    price: 20,
                    availability: 5,
                    image: "Images/computerScience.jpg",
                    alt: "Computer Science lesson"
                },
                {
                    id: 1002,
                    subject: "Maths",
                    location: "Wembley",
                    price: 15,
                    availability: 5,
                    image: "Images/maths.jpg",
                    alt: "Maths lesson"
                },
                {
                    id: 1003,
                    subject: "Art",
                    location: "Camden",
                    price: 18,
                    availability: 5,
                    image: "Images/art.jpg",
                    alt: "Art lesson"
                }
            ],

            cart: [],
            displayCart: false,
            name: "",
            phone: "",
            message: ""

        };
    },

    methods: {

        addToCart(lesson) {
            if (lesson.availability > 0) {
                this.cart.push(lesson.id);
                lesson.availability--;
            }
        },

        removeFromCart(index, lesson) {
            this.cart.splice(index, 1);
            lesson.availability++;
        },

        showCart() {
            this.displayCart = !this.displayCart;
        },

        placeOrder() {
            this.message = "Thank you " + this.name + "! Your order has been placed.";
            this.cart = [];
            this.name = "";
            this.phone = "";
        }

    }

}).mount("#app");

</script>

</body>
</html>
